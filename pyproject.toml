[project]
name = "fabric-eval"
version = "0.1.0"
description = "Verdicts, not scores: judge AI answers over a data platform by source and value"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gustav Kruse" }]
dependencies = ["pyyaml>=6"]
keywords = ["microsoft-fabric", "evaluation", "copilot", "agents", "data-engineering"]

[project.optional-dependencies]
test = ["pytest"]
# the measurement rig in bench/ (fabric-backend supplies the shop schema and its seed rows)
bench = ["anthropic>=0.40", "mcp>=1.9", "pyodbc", "fabric-backend @ git+https://github.com/Krusmaster/fabric-backend.git"]

[project.scripts]
fabric-eval = "fabric_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabric_eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
