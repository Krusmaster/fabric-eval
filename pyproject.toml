[project]
name = "fabric-eval"
version = "0.1.0"
description = "Verdicts, not scores: judge AI answers over a data platform by source and value"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gustav Kruse" }]
dependencies = ["pyyaml>=6"]
keywords = ["microsoft-fabric", "evaluation", "copilot", "agents", "data-engineering"]

[project.optional-dependencies]
test = ["pytest"]
# the measurement rig in bench/ (fabric-backend supplies the shop schema and its seed rows)
# anthropic 2.x: messages.create takes output_config and no sampling parameters; mcp 2.x: the client in bench/mcp_tools.py
# fabric-backend at one commit (5adace8), the same as in CI, bench/README.md and bench/krusgraph_tools.json: the seed rows
# decide every answer, so they move only when the snapshot does (tests/test_bench.py checks the four agree)
bench = ["anthropic>=2,<3", "mcp>=2,<3", "pyodbc",
         "fabric-backend @ git+https://github.com/Krusmaster/fabric-backend.git@5adace8795c629445518b74ad899a0991bdd375f"]

[project.scripts]
fabric-eval = "fabric_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabric_eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
