name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.11", "3.12"] }      # 3.11: f-strings may not reuse their own quotes there
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      # fabric-backend at the commit pyproject.toml pins (10cf219), not main: its seed rows are the bench's answers
      - run: pip install -e ".[test]" "fabric-backend @ git+https://github.com/Krusmaster/fabric-backend.git@10cf219d5d468a4f9138d16547d182992651f7f5"
      - run: pytest -q
